# Offline live-line checks — must run on app / scripts / workflow changes
# (avoids vacuous green from narrow path filters).
name: Live-line CI

on:
  push:
    paths:
      - "app_26.0/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "README.md"
      - "Audit_Mapping.md"
  pull_request:
    paths:
      - "app_26.0/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "CHANGELOG.md"
      - "README.md"
      - "Audit_Mapping.md"
  workflow_dispatch:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Valuation formulas (offline)
        env:
          YNOW_DEBUG_SKIP_PY: "1"
        run: Rscript app_26.0/tests/test_valuation_formulas.R
      - name: Phase 1 formula independence (offline)
        env:
          YNOW_DEBUG_SKIP_PY: "1"
        run: bash scripts/run_phase1_audit.sh
      - name: Maintenance mode (offline)
        env:
          YNOW_DEBUG_SKIP_PY: "1"
        run: |
          Rscript -e 'if (!requireNamespace("jsonlite", quietly = TRUE)) install.packages("jsonlite", quiet = TRUE)'
          Rscript app_26.0/tests/test_maintenance_mode.R
      - name: Admin self view modes (offline)
        env:
          YNOW_DEBUG_SKIP_PY: "1"
        run: Rscript app_26.0/tests/test_admin_view_modes.R
