# Phase 5 — ITGC audit suites (offline / mock; no live Yahoo)
name: ITGC Audit (Phases 2–4)

on:
  push:
    paths:
      - "app_25.0/**"
      - "scripts/run_audit.sh"
      - "scripts/generate_audit_rcm.R"
      - "Audit_Mapping.md"
      - ".github/workflows/audit.yml"
  pull_request:
    paths:
      - "app_25.0/**"
      - "scripts/run_audit.sh"
      - "scripts/generate_audit_rcm.R"
      - "Audit_Mapping.md"
      - ".github/workflows/audit.yml"
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Run ITGC audit + RCM
        run: bash scripts/run_audit.sh
      - name: Upload Audit_RCM_Report.md
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Audit_RCM_Report
          path: |
            Audit_RCM_Report.md
            audit_logs/
