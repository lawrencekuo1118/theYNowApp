# Human Tech Civilization Destruction Index (HTCDI)
# Surveillance reading of civilization-critical energy + tech stack stress.
# Not a buy signal. Ticker stays HTCDI.
# Display name (zh-TW): 人類科技文明毀滅指數

meta:
  id: HTCDI
  name: Human Tech Civilization Destruction Index
  role: civilization_destruction_reading
  not:
    - buy_signal
    - literal_extinction_forecast
    - ordinary_market_cap_index
  governance:
    rebalance: quarterly
    constituent_review: annual
    extraordinary_review: [merger, delist, bankruptcy, structural_split, confirmed_critical_infra_disruption]
    add_names_on: [dependency, replacement_difficulty]
    do_not_add_on: [size, popularity]

criticality_factor_weights:
  cross_industry_dependency: 0.20
  substitute_scarcity: 0.20
  replacement_time: 0.15
  switching_difficulty: 0.10
  installed_base_network: 0.10
  dependency_of_other_critical_sectors: 0.10
  failure_speed: 0.10
  inverse_buffer: 0.05

weighting:
  method: criticality
  layer_cap: 0.25
  issuer_cap: 0.12
  issuer_cap_exceptions:
    ASML: 0.15
    TSM: 0.15
    OIL: 0.15
  liquidity_adj_max: 0.20
  normalize_to: 1.0

composite:
  statement_development: 0.30
  market_vs_benchmark: 0.25
  influence_vs_market: 0.25
  trajectory_vs_history: 0.20

alerts:
  expanding_min: 70
  steady_min: 55
  cooling_min: 40
  cooling_score: 45
  persist_days: 20

layers:
  energy_oil: [OIL]
  lithography: [ASML]
  foundries: [TSM]
  eda: [SNPS, CDNS]
  semiconductors: [TSM, AVGO, NVDA]
  cloud: [MSFT, AMZN, GOOGL]
  enterprise_identity: [MSFT]
  consumer_os_ecosystems: [AAPL, MSFT]
  payment_networks: [V, MA]
  aviation_comms: [ARINC, SITA]
  enterprise_dbs: [ORCL]
  dc_networking: [AVGO]
  ai_computing: [NVDA]

contagion_channels:
  - {id: oil_litho, issuers: [OIL, ASML], persist_days: 20, min_stressed: 2}
  - {id: litho_foundry, issuers: [ASML, TSM], persist_days: 20, min_stressed: 2}
  - {id: foundry_eda, issuers: [TSM, SNPS, CDNS], persist_days: 20, min_stressed: 2}
  - {id: cloud_identity, issuers: [MSFT, AMZN, GOOGL], persist_days: 20, min_stressed: 2}
  - {id: payments, issuers: [V, MA], persist_days: 20, min_stressed: 2}
  - {id: arinc_sita, issuers: [ARINC, SITA], persist_days: 20, min_stressed: 2}
  - {id: semi_cloud_pay, layers: [semiconductors, cloud, payment_networks], persist_days: 20, min_stressed: 3}

issuers:
  - {id: OIL, tickers: [USO], economic_issuer: oil_index, function_id: energy_oil, layer: energy_oil, criticality_prior: 93, quote_currency: USD, statement_currency: USD, instrument_type: etf, underlying_share_comparison_required: false, substitutes: other crude benchmarks (WTI / Brent futures; limited), replacement_time_years: 0, switching_difficulty: 95, buffer: 5, issuer_cap_override: 0.15}
  - {id: ASML, tickers: [ASML], economic_issuer: asml, function_id: semiconductor_equipment, layer: lithography, criticality_prior: 95, quote_currency: USD, statement_currency: EUR, instrument_type: ordinary, underlying_share_comparison_required: false, substitutes: limited trailing-edge lithography (Nikon / Canon), replacement_time_years: 8, switching_difficulty: 92, buffer: 8, issuer_cap_override: 0.15}
