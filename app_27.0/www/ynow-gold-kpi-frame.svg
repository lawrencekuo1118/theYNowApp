<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-hidden="true">
  <defs>
    <filter id="ynowGoldGlow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="ynowGoldTurb" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.045" numOctaves="2" seed="7" result="noise">
        <animate attributeName="baseFrequency" values="0.04;0.055;0.04" dur="2.4s" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="ynowGoldStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE9A0">
        <animate attributeName="stop-color" values="#FFE9A0;#FFB347;#FFE9A0" dur="1.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="45%" stop-color="#FF8C1A">
        <animate attributeName="stop-color" values="#FF8C1A;#FFD24A;#FF8C1A" dur="1.8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#FFC933">
        <animate attributeName="stop-color" values="#FFC933;#FF6A00;#FFC933" dur="1.8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="ynowGoldRayH" cx="50%" cy="50%" r="55%">
      <stop offset="55%" stop-color="#FF9A1A" stop-opacity="0"/>
      <stop offset="78%" stop-color="#FFB347" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FF6A00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Soft outer rays -->
  <rect x="18" y="18" width="164" height="164" fill="none" stroke="url(#ynowGoldRayH)" stroke-width="28" opacity="0.55">
    <animate attributeName="opacity" values="0.4;0.7;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>
  <!-- Core fiery square frame -->
  <rect x="28" y="28" width="144" height="144" rx="6" ry="6"
        fill="none" stroke="url(#ynowGoldStroke)" stroke-width="7"
        filter="url(#ynowGoldTurb)" opacity="0.95"/>
  <rect x="28" y="28" width="144" height="144" rx="6" ry="6"
        fill="none" stroke="#FFE9A0" stroke-width="2.5"
        filter="url(#ynowGoldGlow)" opacity="0.9">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite"/>
  </rect>
  <!-- Ember sparks -->
  <g fill="#FFF4C2" filter="url(#ynowGoldGlow)">
    <circle cx="40" cy="36" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="48" r="1.4"><animate attributeName="opacity" values="1;0.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="52" cy="164" r="1.5"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="168" cy="152" r="1.3"><animate attributeName="opacity" values="1;0.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="30" r="1.2"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="170" r="1.2"><animate attributeName="opacity" values="1;0.35;1" dur="1.25s" repeatCount="indefinite"/></circle>
  </g>
</svg>
