# Business Breakdown Lab — company-agnostic thresholds.
# No ticker lists, company names, platforms, nodes, or statement layouts.
# TSM / 2330 belongs in tests/fixtures only.

meta:
  id: BUSINESS_BREAKDOWN_LAB
  role: experimental_business_decomposition
  not:
    - valuation_input
    - company_overview
    - production_financial_statements

thresholds:
  major_share: 0.10
  min_display_percentage: 0.03
  reconciliation_rel_tol: 0.005
  reconciliation_abs_tol: 1.0
  max_major_businesses: 6
  min_major_businesses: 1

disclosure_priority:
  - operating_segment
  - segment_note
  - product_service
  - revenue_disaggregation
  - mda
  - earnings
  - ir_deck
  - official_description

dimension_score_weights:
  distinct_economics: 1.0
  separate_revenue: 1.0
  attributable_cor_gp: 1.2
  management_major: 0.8
  mutually_exclusive: 1.0
  reconciles: 1.5
  relevant: 0.6
  filed_audited: 0.8

flags:
  geography_customer_location_only_veto: true
  never_combine_overlapping_dimensions: true
  revenue_share_cost_is_final_fallback: true
  consolidated_gm_fallback_default: false
  default_view: reported
